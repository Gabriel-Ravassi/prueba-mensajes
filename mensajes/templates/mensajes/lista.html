<!DOCTYPE html>
<html>
<head>
    <title>Mensajes</title>
</head>
<body>

    <h1>Mensajes recibidos</h1>

    {% for mensaje in mensajes %}
        <p>
            <strong>{{ mensaje.nombre }}</strong>:
            {{ mensaje.texto }}
        </p>
    {% empty %}
        <p>No hay mensajes todavía.</p>
    {% endfor %}

</body>
</html>
